services:
  discorelay:
    build: .
    image: discorelay:2.0.0
    container_name: discorelay
    restart: unless-stopped
    ports:
      - "3080:3080"
    env_file: .env
    environment:
      - CONFIG_PATH=/app/config.json
      - NODE_ENV=production
    volumes:
      # Optional: copy config.example.json to config.json and tune routes/dedup per source.
      - ./config.json:/app/config.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17.11-alpine
    container_name: discorelay-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=discorelay
      - POSTGRES_DB=discorelay
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discorelay -d discorelay"]
      interval: 10s
      timeout: 5s
      retries: 10
